name: ci

# This fork's CI: vet and the unit tests on Linux, as upstream's unit job,
# on every push and pull request, with only public dependencies. Upstream's
# other workflows (cross-compile, integration, interop, fuzzing, benchmarks,
# coverage upload) are upstream's; this fork's changes are offered there.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -shuffle on $(go list ./... | grep -v /integrationtests)
        env:
          TIMESCALE_FACTOR: 10
